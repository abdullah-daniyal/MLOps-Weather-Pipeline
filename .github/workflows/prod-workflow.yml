name: CD for Prod Branch

on:
  push:
    branches: [ prod ]

jobs:
  deploy-to-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install kubectl and Minikube
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apt-transport-https ca-certificates curl

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          # Install Minikube
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube

          # Start Minikube with Docker driver
          minikube start --driver=docker

          # Wait for Minikube to be ready
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace mlops-weather-pipeline || echo "Namespace already exists"

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: i211132usman
          password: Usm@n2003

      - name: Pull Docker Image
        run: docker pull i211132usman/mlops-weather-pipeline-backend:latest

      - name: Tag and Push Prod Image
        run: |
          docker tag i211132usman/mlops-weather-pipeline-backend:latest i211132usman/mlops-weather-pipeline-backend:prod
          docker push i211132usman/mlops-weather-pipeline-backend:prod

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f backend/backend-deployment.yaml -n mlops-weather-pipeline
          kubectl apply -f frontend/frontend-deployment.yaml -n mlops-weather-pipeline
          # Optionally re-apply ingress if needed
          # kubectl apply -f frontend/frontend-ingress.yaml -n mlops-weather-pipeline
