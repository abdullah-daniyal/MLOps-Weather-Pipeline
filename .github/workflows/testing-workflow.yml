name: CI for Testing Branch

on:
  push:
    branches: [ testing ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pandas scikit-learn requests joblib

      - name: Run Unit Tests
        run: |
          pytest dags/tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: i211132usman
          password: Usm@n2003

      - name: Build Docker Image
        run: |
          docker build -t i211132usman/mlops-weather-pipeline-backend:latest -f backend/Dockerfile.backend backend/

      - name: Push Docker Image
        run: |
          docker push i211132usman/mlops-weather-pipeline-backend:testing